# Runs the test suite on GitHub's machines for every push and pull request.
# A green tick on a commit means every test passed on a clean Linux machine,
# with exactly the package versions in requirements.lock.
#
# No secrets are needed: the tests use fake LLM backends and fake sign-in.
# The evaluation documents in data/ are git-ignored (some are private), so the
# two tests that read them are skipped here; run those, and the evals, locally.

name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:  # a "Run workflow" button on the Actions tab

permissions:
  contents: read  # read the code; nothing else

concurrency:  # a newer push to the same branch cancels the older run
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12 and uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.5"
          python-version: "3.12"
          activate-environment: true
          cache-dependency-glob: requirements.lock  # downloaded packages are reused until the lock changes

      - name: Install the exact package versions (CPU-only PyTorch)
        run: uv pip install -r requirements.lock --torch-backend cpu

      # The embedding model and Docling's layout models (~500 MB), downloaded by
      # the tests on first use, are kept between runs.
      - name: Cache downloaded models
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: models-${{ hashFiles('requirements.lock', 'citerag/config.py') }}
          restore-keys: models-

      - name: Run the tests
        run: python -m pytest -q -rs
